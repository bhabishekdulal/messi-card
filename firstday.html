<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Card Design</title>
    <!-- Linking external CSS file as requested -->
    <link rel="stylesheet" href="firstday.css">
</head>
<body>

    <!-- Container div with class "card" -->
    <div class="card">
        <!-- Image of Messi (replace "messi.jpg" with your local image file name) -->
        <img src="messi.jpg" alt="Lionel Messi">
        
        <!-- Heading -->
        <h2>Lionel Messi</h2>
        
        <!-- Short description paragraph -->
        <p>Lionel Messi is one of the greatest football players in history, famous for winning 8 Ballon d'Or awards and leading Argentina to World Cup victory.</p>
        
        <!-- Button / Link -->
        <a href="#" class="card-btn">Read More</a>
    </div>

</body>
</html>
